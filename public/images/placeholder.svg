<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <pattern id="hash" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <pattern id="hash-cross" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#252525" stroke-width="1"/>
    </pattern>
  </defs>
  <rect fill="#141414" width="1200" height="800"/>
  <rect fill="url(#hash)" width="1200" height="800" opacity="0.6"/>
  <rect fill="url(#hash-cross)" width="1200" height="800" opacity="0.4"/>
</svg>
